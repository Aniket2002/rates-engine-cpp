name: build-test-validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  builds:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, compiler: g++, configuration: Release}
          - {os: ubuntu-latest, compiler: clang++, configuration: Debug}
          - {os: windows-latest, compiler: cl, configuration: Release}
          - {os: macos-latest, compiler: clang++, configuration: Release}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: python -m pip install ninja pybind11 QuantLib
      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
          -DRATES_BUILD_PYTHON=ON
          -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - name: Explicit external validation
        shell: bash
        run: python python/validate_results.py --cli build/rates_cli${{ runner.os == 'Windows' && '.exe' || '' }} --output build/external-validation --require-quantlib
      - name: Independent conventions and rate helpers
        shell: bash
        run: python python/validate_conventions.py --cli build/rates_cli${{ runner.os == 'Windows' && '.exe' || '' }} --output build/conventions --require-quantlib
      - name: Independent OIS and multi-curve validation
        run: python python/validate_multicurve.py --module-dir build --out build/multicurve-validation --require-quantlib
      - name: Independent SOFR lifecycle validation
        run: python python/validate_sofr.py --module-dir build --out build/sofr-validation --require-quantlib
      - name: Public fixing replay and dual-curve risk
        run: python python/test_sofr_replay.py --module-dir build --out build/sofr-replay --require-quantlib
      - name: Independent basis-swap calibration and risk
        run: python python/validate_basis.py --module-dir build --out build/basis-validation --require-quantlib
      - name: Independent SOFR hedge and nonlinear stress validation
        run: python python/hedge_study.py --module-dir build --out build/hedging --require-quantlib
      - name: Validate PV-change case study
        shell: bash
        run: python python/generate_case_study.py --cli build/rates_cli${{ runner.os == 'Windows' && '.exe' || '' }} --out build/case-study --require-quantlib
      - run: cmake --install build --prefix install
      - name: Real Fed history and independent validation
        shell: bash
        run: python python/test_real_history.py --batch build/rates_batch${{ runner.os == 'Windows' && '.exe' || '' }} --cli build/rates_cli${{ runner.os == 'Windows' && '.exe' || '' }} --out build/historical-validation --require-quantlib
      - name: Complete 2025 historical replay
        if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'g++'
        run: python python/replay_fed_history.py --batch build/rates_batch --data data/fed-gsw --out build/historical-replay
      - name: Installed consumer
        shell: bash
        run: |
          cmake -S examples/consumer -B build/consumer -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install"
          cmake --build build/consumer
          ./build/consumer/consumer${{ runner.os == 'Windows' && '.exe' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.configuration }}
          path: |
            build/validation/
            build/external-validation/
            build/conventions/
            build/historical-validation/
            build/historical-replay/
            build/trading-validation.json
            build/multicurve-validation/
            build/sofr-validation/
            build/sofr-replay/
            build/basis-validation/
            build/contractual-lifecycle/
            build/hedging/
            build/durable-lifecycle/
            build/case-study/
            build/Testing/Temporary/
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install ninja
      - run: cmake --preset sanitizers -DCMAKE_CXX_COMPILER=clang++
      - run: cmake --build --preset sanitizers --parallel 2
      - run: ctest --preset sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install ninja clang-format==23.1.3 clang-tidy==22.1.8
      - name: Format
        run: find include src apps tests benchmarks python examples -type f \( -name '*.hpp' -o -name '*.cpp' \) -print0 | xargs -0 clang-format --dry-run --Werror
      - run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DRATES_CLANG_TIDY=ON -DBUILD_TESTING=OFF
      - run: cmake --build build --parallel 2
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18
      - run: python -m pip install ninja QuantLib
      - run: cmake -S . -B build/coverage -G Ninja -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_BUILD_TYPE=Debug -DRATES_COVERAGE=ON -DRATES_BUILD_BENCHMARKS=OFF -DLLVM_COV_EXECUTABLE=/usr/bin/llvm-cov-18 -DLLVM_PROFDATA_EXECUTABLE=/usr/bin/llvm-profdata-18
      - run: cmake --build build/coverage --target coverage --parallel 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llvm-coverage
          path: |
            build/coverage/coverage/summary.json
            build/coverage/coverage/report.txt
            build/coverage/coverage/ctest.log
            build/coverage/coverage/uncovered.txt
            build/coverage/coverage/diagnostics.txt
            build/coverage/coverage/html/
